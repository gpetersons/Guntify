name: Build USpot APK
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      USPOT_SIGNING_KEYSTORE: ${{ github.workspace }}/uspot-signing.keystore
      USPOT_STORE_PASSWORD: ${{ secrets.USPOT_STORE_PASSWORD }}
      USPOT_KEY_ALIAS: ${{ secrets.USPOT_KEY_ALIAS }}
      USPOT_KEY_PASSWORD: ${{ secrets.USPOT_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;35.0.0"
      - name: Restore saved signing key
        env:
          SIGNING_KEY: ${{ secrets.USPOT_SIGNING_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64, os, pathlib
          key = os.environ.get('SIGNING_KEY', '').strip()
          if not key:
              raise SystemExit('Missing USPOT_SIGNING_KEYSTORE_BASE64. Use the existing app signing key; do not generate a replacement key for an update.')
          pathlib.Path(os.environ['USPOT_SIGNING_KEYSTORE']).write_bytes(base64.b64decode(''.join(key.split()), validate=True))
          PY
      - name: Extract source
        run: |
          sha256sum USpot-build-68-source.zip
          unzip -q USpot-build-68-source.zip -d build-source
          grep -E 'version(Code|Name) =' build-source/Spotui-Modified/app/build.gradle.kts
          grep -q 'versionCode = 68' build-source/Spotui-Modified/app/build.gradle.kts
      - name: Build and test
        working-directory: build-source/Spotui-Modified
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --max-workers=2
          ./gradlew :app:testDebugUnitTest --no-daemon --max-workers=2
      - name: Package APK and matching source
        run: |
          mkdir -p release
          cp build-source/Spotui-Modified/app/build/outputs/apk/debug/*.apk release/
          cp USpot-build-68-source.zip release/
          cp build-source/Spotui-Modified/{LICENSE,NOTICE,SOURCE.md} release/
      - uses: actions/upload-artifact@v4
        with:
          name: USpot-1.1-build-68-APK
          path: release/*
