name: Build Spotui Modified APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply Spotui Modified source
        shell: bash
        run: |
          test -f Spotui-Modified-discovery-source-fixed.zip || { echo 'Missing source ZIP in repository root'; exit 1; }
          unzip -q -o Spotui-Modified-discovery-source-fixed.zip
          cp -a Spotui-Modified/. ./
          rm -rf Spotui-Modified

      - name: Build installable APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon --max-workers=2 --console=plain -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8" -Dkotlin.compiler.execution.strategy=in-process

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Spotui-Modified-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
