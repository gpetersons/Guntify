name: Build Spotui Modified APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Extract source
        run: unzip -q Spotui-Modified-integrated-source.zip -d build-source
      - name: Build APK
        working-directory: build-source/Spotui-Modified
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --max-workers=2
      - name: Run unit tests
        working-directory: build-source/Spotui-Modified
        run: ./gradlew :app:testDebugUnitTest --no-daemon --max-workers=2
      - uses: actions/upload-artifact@v4
        with:
          name: Spotui-Modified-APK
          path: build-source/Spotui-Modified/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
