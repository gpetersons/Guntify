name: Build Spotui Radio APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Add Radio feature and separate app identity
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          build = Path('app/build.gradle.kts')
          src = build.read_text()
          old = 'applicationId = "com.music.spotui"'
          assert src.count(old) == 1, 'Unexpected app ID; inspect build.gradle.kts'
          build.write_text(src.replace(old, 'applicationId = "com.music.spotui.radio"', 1))

          manifest = Path('app/src/main/AndroidManifest.xml')
          src = manifest.read_text()
          old = 'android:label="@string/app_name"'
          assert src.count(old) == 2, 'Unexpected manifest labels'
          manifest.write_text(src.replace(old, 'android:label="Spotui Radio"'))

          player = Path('app/src/main/java/com/music/spotui/ui/viewmodel/PlayerViewModel.kt')
          src = player.read_text()
          anchor = '    /** Insert a track right after the one currently playing ("Play next"). */'
          assert src.count(anchor) == 1, 'Cannot locate queue actions in PlayerViewModel'
          addition = '''    /** Replace the current queue with this song, play it, then append Spotify recommendations. */
              fun startRadioFromSong(song: SongsModel, context: Context) {
                  currentSongState.updateQueue(listOf(song))
                  updateSongState(song.coverUri, song.title, song.singer, true, song.id, 0, song.album)
                  SongPlayer.playSong(song.url, context)
                  val seed = song.spotifyTrackId
                  if (seed.isBlank()) return
                  viewModelScope.launch(Dispatchers.IO) {
                      val recs = repository.provideRecommendations(listOf(seed))
                      val queueNow = currentSongState.queue.value
                      if (queueNow.size == 1 && queueNow.first().id == song.id && currentSongId.value == song.id) {
                          val fresh = recs.filter { it.id != song.id }.distinctBy { it.id }
                          if (fresh.isNotEmpty()) currentSongState.updateQueue(queueNow + fresh)
                      }
                  }
              }

          '''
          import textwrap
          addition = textwrap.dedent(addition)
          addition = textwrap.indent(addition, '    ')
          src = src.replace(anchor, addition + anchor, 1)
          player.write_text(src)

          sheet = Path('app/src/main/java/com/music/spotui/ui/components/SongOptionsSheet.kt')
          src = sheet.read_text()
          anchor = '            SongMenuRow(Icons.Default.PlayArrow, "Play next") {'
          assert src.count(anchor) == 1, 'Cannot locate Play next in SongOptionsSheet'
          addition = '''            SongMenuRow(Icons.Default.PlayArrow, "Start Radio") {
                          playerViewModel.startRadioFromSong(song, context)
                          onDismiss()
                      }
          '''
          src = src.replace(anchor, addition + anchor, 1)
          sheet.write_text(src)
          PY

      - name: Build installable debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload Spotui Radio APK
        uses: actions/upload-artifact@v4
        with:
          name: Spotui-Radio-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
