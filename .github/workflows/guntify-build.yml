name: Guntify - Build and test
on:
  push:
    branches: [main, 'fix/**', 'release/**', 'branding/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: 'platform-tools platforms;android-34 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Test desktop UI
        working-directory: webui-tests
        run: npm ci --no-fund && npm audit --audit-level=critical && npm test
      - name: Build, unit test and verify release lint
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:testDebugUnitTest :spotify:test :app:lintVitalRelease --no-daemon --max-workers=2
      - name: Upload Guntify test APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Guntify-debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
