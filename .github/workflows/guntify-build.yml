name: Guntify - Build and test
on:
  push:
    branches: [main, 'fix/**', 'release/**', 'branding/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test desktop UI
        working-directory: webui-tests
        run: npm install --no-audit --no-fund && npm test
      - name: Build, unit test and verify release lint
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:testDebugUnitTest :spotify:test :app:lintVitalRelease --no-daemon --max-workers=2
      - name: Upload Guntify test APK
        uses: actions/upload-artifact@v4
        with:
          name: Guntify-debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
