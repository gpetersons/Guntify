name: Sprotify - Withdraw broken Beta 9

# One-time cleanup when this specific workflow is added to main.
# Changes to Android files do NOT trigger it.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/withdraw-beta9.yml'

permissions:
  contents: write

jobs:
  withdraw-beta9:
    if: github.repository == 'gpetersons/Sprotify'
    runs-on: ubuntu-latest
    steps:
      - name: Confirm working Beta 8 exists
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release view v1.0.0-beta.8 --repo "$GH_REPO" > /dev/null
          echo "Stable Beta 8 is published. Beta 8 will not be modified."

      - name: Remove ONLY broken Beta 9 release and tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          bad_tag="v1.0.0-beta.9"
          if gh release view "$bad_tag" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release delete "$bad_tag" --repo "$GH_REPO" --yes --cleanup-tag
          fi
          # A deleted Release may sometimes leave the git tag behind.
          if gh api "repos/${GH_REPO}/git/ref/tags/${bad_tag}" >/dev/null 2>&1; then
            gh api --method DELETE "repos/${GH_REPO}/git/refs/tags/${bad_tag}"
          fi

      - name: Verify Beta 9 gone and Beta 8 retained
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view v1.0.0-beta.9 --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "ERROR: Broken Beta 9 release still exists" >&2
            exit 1
          fi
          if gh api "repos/${GH_REPO}/git/ref/tags/v1.0.0-beta.9" >/dev/null 2>&1; then
            echo "ERROR: Beta 9 git tag still exists" >&2
            exit 1
          fi
          gh release view v1.0.0-beta.8 --repo "$GH_REPO" >/dev/null
          echo "PASS: Beta 9 release and tag absent. Beta 8 retained."
