name: ŠprotiFy - Publish signed beta
on:
  # Publish a new signed beta only when the app version is incremented on main.
  push:
    branches: [main]
    paths:
      - 'app/build.gradle.kts'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: guntify-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: 'platform-tools platforms;android-34 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Restore independent ŠprotiFy signing identity
        env:
          KEYSTORE_BASE64: ${{ secrets.GUNTIFY_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.GUNTIFY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.GUNTIFY_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.GUNTIFY_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64, os, pathlib
          keys = ('KEYSTORE_BASE64','STORE_PASSWORD','KEY_ALIAS','KEY_PASSWORD')
          if not all(os.environ.get(k, '').strip() for k in keys):
              raise SystemExit('Missing GUNTIFY signing secrets. No release will be published.')
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'guntify-release.jks'
          path.write_bytes(base64.b64decode(''.join(os.environ['KEYSTORE_BASE64'].split()), validate=True))
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f'GUNTIFY_SIGNING_KEYSTORE={path}\n')
              f.write('GUNTIFY_STORE_PASSWORD=' + os.environ['STORE_PASSWORD'] + '\n')
              f.write('GUNTIFY_KEY_ALIAS=' + os.environ['KEY_ALIAS'] + '\n')
              f.write('GUNTIFY_KEY_PASSWORD=' + os.environ['KEY_PASSWORD'] + '\n')
          PY
      - name: Test desktop UI
        working-directory: webui-tests
        run: npm ci --no-fund && npm audit --audit-level=critical && npm test
      - name: Test and build signed ŠprotiFy APK
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :spotify:test :app:assembleRelease --no-daemon --max-workers=2
      - name: Verify signed APK metadata
        run: |
          python3 - <<'PY'
          import os, pathlib, subprocess
          tools = pathlib.Path(os.environ['ANDROID_HOME']) / 'build-tools' / '35.0.0'
          apk = pathlib.Path('app/build/outputs/apk/release/app-release.apk')
          if not apk.is_file():
              raise SystemExit('No signed release APK produced.')
          signed = subprocess.check_output([str(tools/'apksigner'), 'verify', '--verbose', '--print-certs', str(apk)], text=True)
          if 'Verified using v2 scheme (APK Signature Scheme v2): true' not in signed:
              raise SystemExit('Release APK failed signature verification.')
          info = subprocess.check_output([str(tools/'aapt'), 'dump', 'badging', str(apk)], text=True).splitlines()[0]
          if ("name='lv.guntify.player'" not in info or
                  "versionCode='4'" not in info or
                  "versionName='1.0.0-beta.4'" not in info):
              raise SystemExit('Unexpected ŠprotiFy APK identity or version.')
          print('Signed ŠprotiFy package verified.')
          PY
      - name: Package source and APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk release/SprotiFy.apk
          git archive --format=zip --prefix=SprotiFy/ -o release/SprotiFy-source.zip HEAD
          cp LICENSE NOTICE SOURCE.md release/
          (cd release && sha256sum SprotiFy.apk SprotiFy-source.zip > SHA256SUMS.txt)
      - name: Publish ŠprotiFy Beta 4 update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=v1.0.0-beta.4
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release already exists. Refusing to overwrite signed release."
            exit 1
          fi
          gh release create "$tag" release/* --target "$GITHUB_SHA" --title "ŠprotiFy 1.0.0 Beta 4" --notes-file RELEASE_NOTES.md --prerelease
